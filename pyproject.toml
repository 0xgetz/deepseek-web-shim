[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-web-shim"
version = "0.1.2"
description = "OpenAI-compatible local shim over DeepSeek's web chat backend (research tool)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "0xgetz" }]
keywords = ["deepseek", "openai-compatible", "proof-of-work", "reverse-engineering", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
wasm = ["wasmtime>=20"]
dev = ["pytest>=8", "wasmtime>=20"]

[project.scripts]
deepseek-web-shim = "deepseek_web_shim.__main__:main"

[project.urls]
Homepage = "https://github.com/0xgetz/deepseek-web-shim"
Issues = "https://github.com/0xgetz/deepseek-web-shim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_web_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
